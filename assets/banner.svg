<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes streamFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverseFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes beaconRing {
        0% { r: 4px; opacity: 1; }
        100% { r: 18px; opacity: 0; }
      }

      .flowing-stream {
        stroke-dasharray: 14 10;
        animation: streamFlow 5s linear infinite;
      }
      .flowing-stream-fast {
        stroke-dasharray: 20 14;
        animation: streamFlow 3s linear infinite;
      }
      .flowing-stream-reverse {
        stroke-dasharray: 12 12;
        animation: reverseFlow 4s linear infinite;
      }
      .floating-pill-1 {
        animation: floatCard1 4.5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatCard2 5.5s ease-in-out infinite;
      }
      .glowing-orb {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .pulse-ring {
        animation: beaconRing 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="150" y1="0" x2="150" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="450" y1="0" x2="450" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="750" y1="0" x2="750" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="180" cy="180" r="140" fill="#06b6d4" opacity="0.08" class="glowing-orb" filter="url(#neonGlow)" />
  <circle cx="1020" cy="160" r="150" fill="#8b5cf6" opacity="0.09" class="glowing-orb" filter="url(#neonGlow)" />
  <circle cx="600" cy="180" r="160" fill="#3b82f6" opacity="0.06" class="glowing-orb" />

  <!-- Dynamic Event Streaming Pipeline Paths (Background layer) -->
  <g opacity="0.75">
    <!-- Stream Line 1: Top wave -->
    <path d="M 0 80 Q 250 30, 500 80 T 1000 80 T 1200 60" fill="none" stroke="url(#glowLine1)" stroke-width="2.5" class="flowing-stream" />
    
    <!-- Stream Line 2: Intersecting Data Flow -->
    <path d="M 0 280 Q 300 320, 600 280 T 1100 290 T 1200 270" fill="none" stroke="url(#glowLine2)" stroke-width="2.5" class="flowing-stream-fast" />

    <!-- Stream Line 3: Diagonal Crossing Flow -->
    <path d="M -50 200 C 250 320, 400 40, 750 140 C 950 210, 1100 120, 1250 150" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.8" class="flowing-stream-reverse" />
  </g>

  <!-- Animated Stream Nodes / Beacons -->
  <g>
    <!-- Left Beacon -->
    <circle cx="120" cy="80" r="4" fill="#06b6d4" filter="url(#softGlow)" />
    <circle cx="120" cy="80" r="4" fill="none" stroke="#06b6d4" stroke-width="1.5" class="pulse-ring" />
    
    <!-- Right Beacon -->
    <circle cx="1060" cy="285" r="4" fill="#ec4899" filter="url(#softGlow)" />
    <circle cx="1060" cy="285" r="4" fill="none" stroke="#ec4899" stroke-width="1.5" class="pulse-ring" />
  </g>

  <!-- Floating Tech Ecosystem Pills (Decorative Side Badges - Floating gently in background margins) -->
  <!-- Left Side Badges -->
  <g class="floating-pill-1" transform="translate(45, 120)">
    <rect width="115" height="34" rx="17" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Kafka</text>
  </g>
  <g class="floating-pill-2" transform="translate(30, 190)">
    <rect width="125" height="34" rx="17" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="4" fill="#ef4444" />
    <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Redpanda</text>
  </g>
  <g class="floating-pill-1" transform="translate(60, 255)">
    <rect width="115" height="32" rx="16" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#06b6d4" />
    <text x="30" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Pulsar</text>
  </g>

  <!-- Right Side Badges -->
  <g class="floating-pill-2" transform="translate(1040, 95)">
    <rect width="115" height="34" rx="17" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="4" fill="#a855f7" />
    <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Flink</text>
  </g>
  <g class="floating-pill-1" transform="translate(1025, 165)">
    <rect width="130" height="34" rx="17" fill="url(#cardBg)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="4" fill="#10b981" />
    <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">RabbitMQ</text>
  </g>
  <g class="floating-pill-2" transform="translate(1050, 235)">
    <rect width="115" height="32" rx="16" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#f59e0b" />
    <text x="30" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">NATS</text>
  </g>

  <!-- FOREGROUND CONTENT: High Z-index, Perfectly Centered and Unobscured -->
  <g id="foreground-hero" transform="translate(600, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 68)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="url(#cyanPurple)" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">⚡ REAL-TIME STREAMING ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8" filter="url(#softGlow)">
      Awesome Event Streaming Platforms
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Guide to Distributed Logs, Cloud Pub/Sub, Stream Processing &amp; Open-Source Brokers
    </text>

    <!-- Feature Attribute Badges / Statistics Footer -->
    <g transform="translate(0, 255)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📊 10+ Cloud SaaS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" />
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⭐ 17+ OSS Engines</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(250, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🚀 Production Benchmarks</text>
      </g>
    </g>
  </g>
</svg>
